  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;tk-forecast-model&quot;&gt;
  &lt;style&gt;
    #tk-forecast-model { color: var(--foreground); display: grid; gap: 18px; }
    #tk-forecast-model .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #tk-forecast-model .form-label { display: grid; gap: 6px; }
    #tk-forecast-model .scenario-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #tk-forecast-model .viz-stat-value { white-space: nowrap; }
    #tk-forecast-model .bars { display: grid; gap: 12px; }
    #tk-forecast-model .bar-row { display: grid; grid-template-columns: 72px 1fr 82px; gap: 10px; align-items: center; }
    #tk-forecast-model .track { height: 16px; background: color-mix(in srgb, var(--muted) 70%, transparent); overflow: hidden; border-radius: 999px; }
    #tk-forecast-model .fill { height: 100%; background: var(--viz-series-1); transition: width .25s ease; }
    #tk-forecast-model .bar-row:nth-child(1) .fill { opacity: .55; }
    #tk-forecast-model .bar-row:nth-child(3) .fill { opacity: .78; }
    #tk-forecast-model .status-good { color: var(--green); }
    #tk-forecast-model .status-warn { color: var(--orange); }
    @media (max-width: 640px) {
      #tk-forecast-model .controls { grid-template-columns: 1fr 1fr; }
      #tk-forecast-model .scenario-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 390px) {
      #tk-forecast-model .controls { grid-template-columns: 1fr; }
      #tk-forecast-model .bar-row { grid-template-columns: 62px 1fr 66px; }
    }
  &lt;/style&gt;

  &lt;h2&gt;TikTok 预算与订单概率预测&lt;/h2&gt;

  &lt;section class=&quot;controls&quot; aria-label=&quot;业务参数&quot;&gt;
    &lt;label class=&quot;form-label&quot;&gt;投放国家
      &lt;select class=&quot;form-select&quot; data-key=&quot;country&quot;&gt;
        &lt;option value=&quot;north_america&quot;&gt;北美（美国＋加拿大）&lt;/option&gt;&lt;option value=&quot;us&quot;&gt;美国&lt;/option&gt;&lt;option value=&quot;uk&quot;&gt;英国&lt;/option&gt;&lt;option value=&quot;de&quot;&gt;德国&lt;/option&gt;
        &lt;option value=&quot;ca&quot;&gt;加拿大&lt;/option&gt;&lt;option value=&quot;au&quot;&gt;澳大利亚&lt;/option&gt;&lt;option value=&quot;sea&quot;&gt;东南亚综合&lt;/option&gt;&lt;option value=&quot;my&quot;&gt;马来西亚&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;产品品类
      &lt;select class=&quot;form-select&quot; data-key=&quot;category&quot;&gt;
        &lt;option value=&quot;beauty&quot;&gt;美妆个护&lt;/option&gt;&lt;option value=&quot;apparel&quot;&gt;服装配饰&lt;/option&gt;&lt;option value=&quot;home&quot;&gt;家居用品&lt;/option&gt;
        &lt;option value=&quot;electronics&quot;&gt;消费电子&lt;/option&gt;&lt;option value=&quot;wellness&quot;&gt;健康保健&lt;/option&gt;&lt;option value=&quot;pet&quot;&gt;宠物用品&lt;/option&gt;&lt;option value=&quot;general&quot;&gt;综合百货&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;历史有效订单数据
      &lt;select class=&quot;form-select&quot; data-key=&quot;history&quot;&gt;
        &lt;option value=&quot;none&quot;&gt;无历史数据&lt;/option&gt;&lt;option value=&quot;small&quot;&gt;少于 100 单&lt;/option&gt;&lt;option value=&quot;medium&quot;&gt;100–500 单&lt;/option&gt;&lt;option value=&quot;large&quot;&gt;超过 500 单&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;每月广告预算（$）&lt;input class=&quot;form-control&quot; data-key=&quot;monthlyBudget&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;100&quot; value=&quot;3000&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;预测周期（天）&lt;input class=&quot;form-control&quot; data-key=&quot;days&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;目标有效订单（单）&lt;input class=&quot;form-control&quot; data-key=&quot;target&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;平均客单价 AOV（$）&lt;input class=&quot;form-control&quot; data-key=&quot;aov&quot; type=&quot;number&quot; min=&quot;1&quot; step=&quot;1&quot; value=&quot;80&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;商品成本率（%）&lt;input class=&quot;form-control&quot; data-key=&quot;cogs&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;每单物流履约（$）&lt;input class=&quot;form-control&quot; data-key=&quot;shipping&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;支付手续费率（%）&lt;input class=&quot;form-control&quot; data-key=&quot;fee&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.1&quot; value=&quot;3.5&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;订单模式
      &lt;select class=&quot;form-select&quot; data-key=&quot;payment&quot;&gt;&lt;option value=&quot;prepaid&quot;&gt;在线支付&lt;/option&gt;&lt;option value=&quot;cod&quot;&gt;货到付款 COD&lt;/option&gt;&lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;统计口径
      &lt;select class=&quot;form-select&quot; data-key=&quot;orderType&quot;&gt;&lt;option value=&quot;valid&quot;&gt;扣除退款后的有效订单&lt;/option&gt;&lt;option value=&quot;platform&quot;&gt;TikTok 归因下单&lt;/option&gt;&lt;/select&gt;
    &lt;/label&gt;
  &lt;/section&gt;

  &lt;section class=&quot;scenario-grid&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;div class=&quot;text-muted&quot;&gt;保守预测&lt;/div&gt;&lt;div class=&quot;viz-stat-value tabular-nums&quot; data-out=&quot;ordersConservative&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot; data-out=&quot;cpaConservative&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;div class=&quot;text-muted&quot;&gt;中位预测&lt;/div&gt;&lt;div class=&quot;viz-stat-value tabular-nums&quot; data-out=&quot;ordersMedian&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot; data-out=&quot;cpaMedian&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;div class=&quot;text-muted&quot;&gt;乐观预测&lt;/div&gt;&lt;div class=&quot;viz-stat-value tabular-nums&quot; data-out=&quot;ordersOptimistic&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot; data-out=&quot;cpaOptimistic&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;bars&quot; aria-label=&quot;订单情景比较&quot;&gt;
    &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;保守&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; data-bar=&quot;conservative&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;text-end tabular-nums&quot; data-out=&quot;barConservative&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;中位&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; data-bar=&quot;median&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;text-end tabular-nums&quot; data-out=&quot;barMedian&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;乐观&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; data-bar=&quot;optimistic&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;text-end tabular-nums&quot; data-out=&quot;barOptimistic&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;table-responsive&quot; aria-live=&quot;polite&quot;&gt;
    &lt;table class=&quot;table table-sm&quot;&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;th&gt;预测周期总消耗&lt;/th&gt;&lt;td class=&quot;text-end&quot; data-out=&quot;spend&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;达到目标的保守预算&lt;/th&gt;&lt;td class=&quot;text-end&quot; data-out=&quot;safeBudget&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;按当前月预算达到目标&lt;/th&gt;&lt;td class=&quot;text-end&quot; data-out=&quot;daysToTarget&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;盈亏平衡 CPA&lt;/th&gt;&lt;td class=&quot;text-end&quot; data-out=&quot;breakevenCpa&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;中位预测广告后利润&lt;/th&gt;&lt;td class=&quot;text-end&quot; data-out=&quot;profit&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;目标判断&lt;/th&gt;&lt;td class=&quot;text-end&quot; data-out=&quot;goalStatus&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;th&gt;当前规划基准&lt;/th&gt;&lt;td class=&quot;text-end&quot; data-out=&quot;benchmark&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;p class=&quot;text-small text-muted&quot;&gt;结果为规划区间，不构成订单保证；选择“无历史数据”时区间更宽，实际投放数据越多，模型越适合收窄。&lt;/p&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;tk-forecast-model&#x27;);
      const fields = [...root.querySelectorAll(&#x27;[data-key]&#x27;)];
      const category = {
        beauty:{cpm:9,ctr:1.25,cvr:2.2}, apparel:{cpm:8,ctr:1.1,cvr:1.7}, home:{cpm:7.5,ctr:1.05,cvr:2.0},
        electronics:{cpm:10,ctr:1.0,cvr:1.5}, wellness:{cpm:11,ctr:.9,cvr:1.4}, pet:{cpm:8,ctr:1.2,cvr:2.1}, general:{cpm:8.5,ctr:1.0,cvr:1.8}
      };
      const country = {north_america:1.13,us:1.2,uk:1.08,de:1.0,ca:1.05,au:1.12,sea:.58,my:.48};
      const uncertainty = {none:.50,small:.35,medium:.25,large:.15};
      const money = n =&gt; Number.isFinite(n) ? new Intl.NumberFormat(&#x27;zh-CN&#x27;,{style:&#x27;currency&#x27;,currency:&#x27;USD&#x27;,maximumFractionDigits:0}).format(n) : &#x27;—&#x27;;
      const num = n =&gt; Number.isFinite(n) ? new Intl.NumberFormat(&#x27;zh-CN&#x27;,{maximumFractionDigits:0}).format(n) : &#x27;—&#x27;;
      const set = (key,value) =&gt; root.querySelectorAll(`[data-out=&quot;${key}&quot;]`).forEach(el =&gt; el.textContent=value);
      function update(){
        const v=Object.fromEntries(fields.map(f=&gt;[f.dataset.key,f.tagName===&#x27;SELECT&#x27;?f.value:Math.max(0,Number(f.value)||0)]));
        const b=category[v.category], cpm=b.cpm*country[v.country];
        const refund=v.orderType===&#x27;platform&#x27;?0:(v.payment===&#x27;cod&#x27;?.22:.08);
        const medianCpa=(cpm/1000)/(b.ctr/100)/(b.cvr/100)/(1-refund);
        const u=uncertainty[v.history];
        const conservativeCpa=medianCpa*(1+u), optimisticCpa=medianCpa*Math.max(.35,1-u);
        const spend=v.monthlyBudget*v.days/30;
        const ordersC=spend/conservativeCpa, ordersM=spend/medianCpa, ordersO=spend/optimisticCpa;
        const safeBudget=v.target*conservativeCpa;
        const daysToTarget=v.monthlyBudget&gt;0?safeBudget/v.monthlyBudget*30:Infinity;
        const breakEven=Math.max(0,v.aov-(v.aov*v.cogs/100+v.shipping+v.aov*v.fee/100));
        const profit=ordersM*breakEven-spend;
        set(&#x27;ordersConservative&#x27;,`${num(ordersC)} 单`); set(&#x27;ordersMedian&#x27;,`${num(ordersM)} 单`); set(&#x27;ordersOptimistic&#x27;,`${num(ordersO)} 单`);
        set(&#x27;cpaConservative&#x27;,`CPA ${money(conservativeCpa)}`); set(&#x27;cpaMedian&#x27;,`CPA ${money(medianCpa)}`); set(&#x27;cpaOptimistic&#x27;,`CPA ${money(optimisticCpa)}`);
        set(&#x27;barConservative&#x27;,`${num(ordersC)} 单`); set(&#x27;barMedian&#x27;,`${num(ordersM)} 单`); set(&#x27;barOptimistic&#x27;,`${num(ordersO)} 单`);
        const scale=Math.max(ordersO,v.target,1);
        root.querySelector(&#x27;[data-bar=&quot;conservative&quot;]&#x27;).style.width=`${Math.min(100,ordersC/scale*100)}%`;
        root.querySelector(&#x27;[data-bar=&quot;median&quot;]&#x27;).style.width=`${Math.min(100,ordersM/scale*100)}%`;
        root.querySelector(&#x27;[data-bar=&quot;optimistic&quot;]&#x27;).style.width=`${Math.min(100,ordersO/scale*100)}%`;
        set(&#x27;spend&#x27;,money(spend)); set(&#x27;safeBudget&#x27;,money(safeBudget)); set(&#x27;daysToTarget&#x27;,`${num(daysToTarget)} 天`);
        set(&#x27;breakevenCpa&#x27;,money(breakEven)); set(&#x27;profit&#x27;,money(profit));
        const goal=root.querySelector(&#x27;[data-out=&quot;goalStatus&quot;]&#x27;);
        if(ordersC&gt;=v.target){goal.textContent=&#x27;保守情景也可达到&#x27;;goal.className=&#x27;text-end status-good&#x27;;}
        else if(ordersM&gt;=v.target){goal.textContent=&#x27;中位情景可达到&#x27;;goal.className=&#x27;text-end status-warn&#x27;;}
        else{goal.textContent=`预算缺口约 ${money(Math.max(0,safeBudget-spend))}`;goal.className=&#x27;text-end status-warn&#x27;;}
        set(&#x27;benchmark&#x27;,`CPM ${money(cpm)} · CTR ${b.ctr}% · CVR ${b.cvr}%`);
      }

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;

        floating.style.visibility = &quot;visible&quot;;

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }

    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)

      if (pinnedByTouch) {

      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }

  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
