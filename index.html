.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {

  }

  .form-control-color[type=&quot;color&quot;] {

  }

    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {
    display: inline-flex;

  }

    height: 44px;
  }

    height: 44px;
  }

  &lt;/style&gt;

  &lt;/div&gt;

  &lt;p class=&quot;text-small text-muted&quot;&gt;CSV每行代表一天；有效订单应使用扣除取消、退款、拒付和COD拒收后的统一口径。边际曲线按日消耗分位数分档并进行单调校正。&lt;/p&gt;

  &lt;script&gt;
    (()=&gt;{
      const root=document.getElementById(&#x27;tk-daily-cpa&#x27;);

      function split(line,sep){const out=[];let s=&#x27;&#x27;,quoted=false;for(let i=0;i&lt;line.length;i++){const c=line[i];if(c===&#x27;&quot;&#x27;){if(quoted&amp;&amp;line[i+1]===&#x27;&quot;&#x27;){s+=&#x27;&quot;&#x27;;i++}else quoted=!quoted}else if(c===sep&amp;&amp;!quoted){out.push(s.trim());s=&#x27;&#x27;}else s+=c}out.push(s.trim());return out}
      function parseCSV(text){const lines=text.replace(/^\uFEFF/,&#x27;&#x27;).split(/\r?\n/).filter(x=&gt;x.trim());if(lines.length&lt;2)throw new Error(&#x27;至少需要表头和1行数据&#x27;);const sep=lines[0].includes(&#x27;\t&#x27;)?&#x27;\t&#x27;:&#x27;,&#x27;;const head=split(lines[0],sep).map(x=&gt;x.toLowerCase().replace(/\s+/g,&#x27;_&#x27;));const find=names=&gt;head.findIndex(h=&gt;names.includes(h));const di=find([&#x27;date&#x27;,&#x27;日期&#x27;,&#x27;day&#x27;]),si=find([&#x27;spend&#x27;,&#x27;cost&#x27;,&#x27;广告消耗&#x27;,&#x27;消耗&#x27;,&#x27;amount_spent&#x27;]),oi=find([&#x27;valid_orders&#x27;,&#x27;orders&#x27;,&#x27;有效订单&#x27;,&#x27;有效单量&#x27;,&#x27;purchases&#x27;]);if(si&lt;0||oi&lt;0)throw new Error(&#x27;未找到 spend 和 valid_orders 列&#x27;);return lines.slice(1).map(l=&gt;{const a=split(l,sep),spend=Number(String(a[si]||&#x27;&#x27;).replace(/[$,]/g,&#x27;&#x27;)),orders=Number(String(a[oi]||&#x27;&#x27;).replace(/,/g,&#x27;&#x27;));return{date:di&gt;=0?a[di]:&#x27;&#x27;,spend,orders}}).filter(r=&gt;Number.isFinite(r.spend)&amp;&amp;r.spend&gt;=0&amp;&amp;Number.isFinite(r.orders)&amp;&amp;r.orders&gt;=0)}
      function quantile(a,p){const x=[...a].sort((m,n)=&gt;m-n),pos=(x.length-1)*p,b=Math.floor(pos),r=pos-b;return x[b]+((x[b+1]??x[b])-x[b])*r}
      function clean(data){if(q(&#x27;outlier&#x27;).value===&#x27;keep&#x27;||data.length&lt;20)return data;const vals=data.map(r=&gt;r.orders&gt;0?r.spend/r.orders:Infinity).filter(Number.isFinite),lo=quantile(vals,.025),hi=quantile(vals,.975);return data.filter(r=&gt;r.orders===0||((r.spend/r.orders)&gt;=lo&amp;&amp;(r.spend/r.orders)&lt;=hi))}
      function buildBins(data){const sorted=[...data].sort((a,b)=&gt;a.spend-b.spend),count=Math.min(6,Math.max(3,Math.floor(sorted.length/15))),bins=[];for(let i=0;i&lt;count;i++){const part=sorted.slice(Math.floor(i*sorted.length/count),Math.floor((i+1)*sorted.length/count));const spend=part.reduce((s,r)=&gt;s+r.spend,0),orders=part.reduce((s,r)=&gt;s+r.orders,0);bins.push({days:part.length,x:spend/Math.max(1,part.length),orders,raw:orders&gt;0?spend/orders:Infinity})}let last=0;bins.forEach(b=&gt;{b.cpa=Math.max(last,Number.isFinite(b.raw)?b.raw:last||1);last=b.cpa});return bins}
